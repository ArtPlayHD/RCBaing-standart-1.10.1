<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мини-Minecraft — моды и читы</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; }
  #hud { position: fixed; top: 10px; left: 10px; color: #fff; font-size: 15px;
         text-shadow: 1px 1px 2px #000; pointer-events: none; }
  .panel { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
           align-items: center; justify-content: center; }
  .card { background: #2b2b2b; color: #fff; padding: 18px; border-radius: 10px;
          width: min(560px, 92vw); max-height: 86vh; overflow-y: auto;
          box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .card h2 { margin: 0 0 10px; font-size: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
         padding: 7px 0; border-bottom: 1px solid #3d3d3d; }
  .row small { color: #b5b5b5; display: block; }
  .row button { background: #4caf50; color: #fff; border: 0; border-radius: 6px;
                padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .row button.off { background: #666; }
  .card .close { margin-top: 12px; width: 100%; padding: 9px; background: #555;
                 color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .card h3 { margin: 14px 0 6px; font-size: 15px; color: #ffd54f; }
  #modCode { width: 100%; min-height: 110px; box-sizing: border-box; background: #1b1b1b;
             color: #c8ffd8; border: 1px solid #444; border-radius: 6px;
             font: 12px/1.4 monospace; padding: 8px; resize: vertical; }
  .card textarea::placeholder { color: #666; }
  .hint { color: #9e9e9e; font-size: 12px; margin-top: 6px; }
  #runMod { margin-top: 8px; width: 100%; padding: 9px; background: #0288d1; color: #fff;
            border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="pausePanel" class="panel" style="display:none">
  <div class="card">
    <h2>Пауза</h2>
    <div class="row"><span>Вернуться в игру</span>
      <button onclick="closePause()">Продолжить</button></div>
    <div class="row"><span>Начать заново</span>
      <button onclick="newWorld()">Новый мир</button></div>
    <div class="row"><span>Сохранить мир в файл</span>
      <button onclick="saveWorld()">Сохранить</button></div>
    <div class="row"><span>Загрузить мир из файла</span>
      <button onclick="loadWorld()">Загрузить</button></div>
  </div>
</div>

<div id="modsPanel" class="panel" style="display:none">
  <div class="card">
    <h2>⚙ Моды и читы</h2>
    <div id="modList"></div>
    <h3>🧩 Свой мод на JS</h3>
    <textarea id="modCode" spellcheck="false" placeholder="API.onUpdate(dt => { API.player.vel.y += 4*dt; });&#10;// или API.addCommand('laser', a => {...})"></textarea>
    <button id="runMod" onclick="applyUserMod()">▶ Запустить мод</button>
    <div class="hint">Доступно: API.onUpdate, API.addCommand, API.player, API.mobs,
      API.inv, API.mods, API.cmd, API.spawnParticles, API.explode, API.damageMob и др.</div>
    <div id="modCustom"></div>
    <button class="close" onclick="closeMods()">Закрыть</button>
  </div>
</div>

<div id="craftPanel" class="panel" style="display:none">
  <div class="card">
    <h2>🔨 Крафт</h2>
    <div id="craftList"></div>
    <button class="close" onclick="closeCraft()">Закрыть</button>
  </div>
</div>

<input type="file" id="fileIn" accept=".json" style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
